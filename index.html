<script>
// This shell handles layout only. Calendar operations and credentials stay in Google.

const googleOrigin=origin=>origin==='https://script.google.com'||origin==='https://script.googleusercontent.com'||/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(origin);
let child=null,nonce=null;
window.addEventListener('message',e=>{
 if(!googleOrigin(e.origin)||typeof e.data?.nonce!=='string'||e.data.nonce.length>100)return;
 if(e.data.type==='kamiwaza-booking-ready'){
  child=e.source;nonce=e.data.nonce;e.source.postMessage({type:'kamiwaza-booking-approved',nonce},e.origin);
  document.querySelector('#frameStatus').textContent='Times are checked against the team’s calendars. Your invitation will include Google Meet details.';
 }
 if(e.data.type==='kamiwaza-booking-size'&&e.source===child&&e.data.nonce===nonce&&Number.isFinite(e.data.height))document.querySelector('#booking').style.height=Math.min(5000,Math.max(850,e.data.height+32))+'px';
});
